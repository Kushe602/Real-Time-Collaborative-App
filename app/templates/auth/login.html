{% extends "base.html" %}
{% block title %}Log in — {{ app_name }}{% endblock %}
{% block body %}
<div class="grid min-h-full place-items-center px-6">
  <div class="w-full max-w-sm">
    <a href="/" class="mb-6 flex items-center justify-center gap-2 text-lg font-semibold">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-indigo-500">◈</span>
      {{ app_name }}
    </a>
    <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-8">
      <h1 class="text-xl font-semibold">Welcome back</h1>
      <p class="mt-1 text-sm text-slate-400">Log in to your workspaces.</p>

      {% if error %}
        <div class="mt-4 rounded-lg border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-300">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="/login" class="mt-6 space-y-4">
        <div>
          <label class="block text-sm text-slate-300" for="email">Email</label>
          <input id="email" name="email" type="email" required autofocus
                 class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300" for="password">Password</label>
          <input id="password" name="password" type="password" required
                 class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
        </div>
        <button type="submit"
                class="w-full rounded-lg bg-indigo-500 px-4 py-2 font-medium hover:bg-indigo-400">
          Log in
        </button>
      </form>
    </div>
    <p class="mt-4 text-center text-sm text-slate-400">
      New here? <a href="/register" class="text-indigo-400 hover:underline">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
