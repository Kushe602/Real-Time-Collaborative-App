<div class="cs-comment flex gap-2" data-comment="{{ c.id }}">
  <span class="grid h-7 w-7 flex-none place-items-center rounded-full text-[10px] font-semibold text-white"
        style="background: {{ author.color if author else '#64748b' }}">{{ (author.display_name if author else "?") | initials }}</span>
  <div class="min-w-0 flex-1">
    <div class="flex items-baseline gap-2">
      <span class="text-xs font-medium text-slate-300">{{ author.display_name if author else "Someone" }}</span>
      <span class="text-[10px] text-slate-500">{{ c.created_at.strftime("%b %d, %H:%M") if c.created_at else "" }}</span>
    </div>
    <div class="whitespace-pre-wrap break-words text-sm text-slate-200">{{ c.body | mentions }}</div>
  </div>
</div>
